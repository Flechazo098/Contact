architectury {
    common rootProject.enabled_platforms.split(',')
}

loom {
    accessWidenerPath = file("src/main/resources/contact.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modCompileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation 'cc.sighs.oelib:OELib-common-api-1.21.1:0.0.7'
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(remapJar) {
                builtBy tasks.remapJar
                classifier null
            }
            artifact(tasks.sourcesJar) {
                classifier "sources"
            }
        }
    }
}